[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-platform"
version = "0.1.0"
description = "Enterprise Retail Sales Analytics Platform - production-grade batch analytics over synthetic retail transaction data."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "polars>=1.9.0",
    "pyarrow>=17.0.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
    "streamlit>=1.39.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
    "pandera>=0.20.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools]
packages = [
    "config",
    "core",
    "utils",
    "services",
    "data",
    "data.generators",
    "pipelines",
    "analytics",
    "streaming",
    "dashboard",
    "dashboard.pages",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=pipelines --cov=analytics --cov-report=term-missing"
